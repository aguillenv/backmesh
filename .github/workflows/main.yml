name: Cloudflare Worker

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install wrangler
        run: npm install

      - name: Setup environment variables
        run: |
          echo "TEST_USER_PASS=${{ secrets.TEST_USER_PASS }}" >> .dev.vars
          echo "NIMBUS_GEMINI_API_KEY=${{ secrets.NIMBUS_GEMINI_API_KEY }}" >> .dev.vars
          echo "NIMBUS_OPENAI_API_KEY=${{ secrets.NIMBUS_OPENAI_API_KEY }}" >> .dev.vars

      - name: Run tests
        run: npx vitest run

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install wrangler
        run: npm install

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
